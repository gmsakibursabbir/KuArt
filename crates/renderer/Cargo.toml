[package]
name = "ude-renderer"
description = "Scene traversal and painting for GPU (vello) and CPU (vello_cpu) backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Photoshop layer channels are decoded on demand.
ude-format-psd = { path = "../formats/psd" }
parley = "0.11"
ude-core = { path = "../core" }
vello = "0.11"
vello_cpu = { version = "0.3", features = ["multithreading"] }

[lints]
workspace = true
