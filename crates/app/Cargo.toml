[package]
name = "ude-app"
description = "KuArt desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "design-editor"
path = "src/main.rs"

[dependencies]
ude-core = { path = "../core" }
ude-renderer = { path = "../renderer" }
ude-format-native = { path = "../formats/native" }
ude-bench = { path = "../benchmarks" }
winit = "0.30"
pollster = "1"
softbuffer = "0.4"
ude-spatial = { version = "0.0.1", path = "../spatial" }
ude-editor = { version = "0.0.1", path = "../editor" }
ude-ui = { version = "0.0.1", path = "../ui" }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard", "wayland", "x11"] }
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std", "rayon"] }
bytemuck = "1"

[lints]
workspace = true
