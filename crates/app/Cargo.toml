[package]
name = "ude-app"
description = "KuArt desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "design-editor"
path = "src/main.rs"

[dependencies]
ude-core = { path = "../core" }
ude-renderer = { path = "../renderer" }
ude-format-native = { path = "../formats/native" }
ude-bench = { path = "../benchmarks" }
winit = "0.30"
pollster = "1"
softbuffer = "0.4"
ude-spatial = { path = "../spatial" }
ude-editor = { path = "../editor" }
ude-ui = { path = "../ui" }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard", "wayland", "x11"] }
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std", "rayon"] }
bytemuck = "1"
ude-format-raster = { path = "../formats/raster" }
rfd = "0.17"
ude-format-svg = { path = "../formats/svg" }
ude-format-svg-import = { path = "../formats/svg-import" }
ude-format-psd = { path = "../formats/psd" }
ude-format-fig = { path = "../formats/fig" }
ude-format-xd = { path = "../formats/xd" }
ude-format-sketch = { path = "../formats/sketch" }
ude-format-pdf = { path = "../formats/pdf" }
ude-diagnostics = { path = "../diagnostics" }
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "3"

[lints]
workspace = true

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Linux packages (release.yml). Icons are generated from assets/icon.png into
# packaging/linux/icons/ by the workflow before packaging.
[package.metadata.deb]
name = "kuart"
maintainer = "Sakibur Rahman Sabbir"
copyright = "KuArt contributors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = "Fast, offline design editor: opens Figma, Adobe XD, Photoshop and SVG files, exports PNG/SVG and generates HTML/CSS/React code."
section = "graphics"
priority = "optional"
depends = "libvulkan1 | libgl1, libfontconfig1, libxkbcommon0"
assets = [
    ["target/release/design-editor", "usr/bin/", "755"],
    ["target/release/design-editor-cli", "usr/bin/", "755"],
    ["../../packaging/linux/io.github.gmsakibursabbir.KuArt.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/io.github.gmsakibursabbir.KuArt.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/linux/io.github.gmsakibursabbir.KuArt.xml", "usr/share/mime/packages/", "644"],
    ["../../packaging/linux/icons/16/io.github.gmsakibursabbir.KuArt.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../packaging/linux/icons/32/io.github.gmsakibursabbir.KuArt.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../packaging/linux/icons/48/io.github.gmsakibursabbir.KuArt.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../packaging/linux/icons/64/io.github.gmsakibursabbir.KuArt.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../packaging/linux/icons/128/io.github.gmsakibursabbir.KuArt.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../packaging/linux/icons/256/io.github.gmsakibursabbir.KuArt.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../packaging/linux/icons/512/io.github.gmsakibursabbir.KuArt.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "kuart"
summary = "Fast, offline design editor"
license = "MIT OR Apache-2.0"
assets = [
    { source = "target/release/design-editor", dest = "/usr/bin/design-editor", mode = "755" },
    { source = "target/release/design-editor-cli", dest = "/usr/bin/design-editor-cli", mode = "755" },
    { source = "../../packaging/linux/io.github.gmsakibursabbir.KuArt.desktop", dest = "/usr/share/applications/io.github.gmsakibursabbir.KuArt.desktop", mode = "644" },
    { source = "../../packaging/linux/io.github.gmsakibursabbir.KuArt.metainfo.xml", dest = "/usr/share/metainfo/io.github.gmsakibursabbir.KuArt.metainfo.xml", mode = "644" },
    { source = "../../packaging/linux/io.github.gmsakibursabbir.KuArt.xml", dest = "/usr/share/mime/packages/io.github.gmsakibursabbir.KuArt.xml", mode = "644" },
    { source = "../../packaging/linux/icons/256/io.github.gmsakibursabbir.KuArt.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.gmsakibursabbir.KuArt.png", mode = "644" },
    { source = "../../packaging/linux/icons/512/io.github.gmsakibursabbir.KuArt.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.gmsakibursabbir.KuArt.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
fontconfig = "*"
libxkbcommon = "*"
