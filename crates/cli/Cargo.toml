[package]
name = "ude-cli"
description = "Headless command-line tools (no GUI, no GPU)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "design-editor-cli"
path = "src/main.rs"

[dependencies]
ude-core = { path = "../core" }
ude-format-native = { path = "../formats/native" }
# Synthetic documents for `generate`.
ude-bench = { path = "../benchmarks" }
ude-format-raster = { version = "0.0.1", path = "../formats/raster" }
ude-renderer = { version = "0.0.1", path = "../renderer" }
ude-format-svg = { version = "0.0.1", path = "../formats/svg" }
ude-format-svg-import = { version = "0.0.1", path = "../formats/svg-import" }
ude-editor = { path = "../editor" }
serde_json = "1"
ude-codegen = { path = "../codegen" }
ude-format-psd = { path = "../formats/psd" }
ude-format-fig = { path = "../formats/fig" }

[lints]
workspace = true
