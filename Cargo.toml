[workspace]
resolver = "3"
members = ["crates/core", "crates/formats/native", "crates/benchmarks", "crates/cli", "crates/renderer", "crates/app", "crates/spatial", "crates/editor", "crates/ui", "crates/formats/raster", "crates/formats/svg", "crates/formats/svg-import", "crates/codegen", "crates/formats/psd", "crates/formats/fig", "crates/formats/zip", "crates/formats/xd", "crates/diagnostics", "crates/formats/sketch", "crates/formats/pdf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
